name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "python/[dev]"
      - name: Ruff
        run: ruff check python
      - name: Pytest with coverage
        run: |
          pytest python/tests -q \
            --cov=homelink --cov-report=term-missing --cov-fail-under=80

  api:
    name: API (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install
        working-directory: api
        run: npm ci
      - name: Build
        working-directory: api
        run: npm run build
      - name: Test with coverage
        working-directory: api
        run: npm run coverage

  dashboard:
    name: Dashboard (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        working-directory: dashboard
        run: npm ci
      - name: Build
        working-directory: dashboard
        run: npm run build
      - name: Unit tests
        working-directory: dashboard
        run: npm test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_BIN: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            dashboard/package-lock.json
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e "python/[dev]"
      - name: Build API
        working-directory: api
        run: |
          npm ci
          npm run build
      - name: Install dashboard
        working-directory: dashboard
        run: npm ci
      - name: Install Playwright browser
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Generate fleet analytics
        run: |
          python -m homelink.analytics.generate_fleet --seed 7 --devices 40 --days 30
          python -m homelink.analytics.fleet
      - name: Run Playwright
        working-directory: dashboard
        run: npx playwright test
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            dashboard/playwright-report
            dashboard/test-results
          if-no-files-found: ignore
          retention-days: 7

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e "python/[dev]"
      - name: Build API (for read-latency phase)
        working-directory: api
        run: |
          npm ci
          npm run build
      - name: Run benchmark
        run: python scripts/bench.py
      - name: Upload bench.json
        uses: actions/upload-artifact@v4
        with:
          name: bench-json
          path: bench/out/bench.json
          retention-days: 14
