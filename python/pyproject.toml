[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homelink"
version = "0.1.0"
description = "HomeLinkIoT: connected-appliance telemetry, shadow, and control stack"
requires-python = ">=3.11"
dependencies = [
  "paho-mqtt==2.1.0",
  "cryptography==43.0.3",
  "numpy==2.1.3",
  "matplotlib==3.9.2",
  "boto3==1.35.60",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "pytest-timeout==2.3.1",
  "moto[dynamodb]==5.0.22",
  "ruff==0.7.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["homelink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 120
markers = [
  "negative: invalid-input and failure-injection tests",
  "regression: golden-output regression tests",
  "slow: tests that take more than a few seconds",
]

[tool.coverage.run]
source = ["homelink"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
